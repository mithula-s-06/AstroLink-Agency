<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crew Log Details - AstroLink Agency</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background: #1a2841;
            color: #e0e0e0;
        }
        
        .details-container {
            width: 100%;
            min-height: 100vh;
            padding: 2rem;
            background: #1a2841;
        }
        
        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(0, 188, 212, 0.3);
            padding-bottom: 1rem;
        }
        
        .details-header h1 {
            font-size: 2.5rem;
            margin: 0;
            color: white;
        }
        
        .back-btn {
            background: #1e3a5f;
            color: #00bcd4;
            border: 1px solid #00bcd4;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: #00bcd4;
            color: #1e3a5f;
        }
        
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .detail-card {
            background: rgba(30, 58, 95, 0.8);
            border: 1px solid rgba(0, 188, 212, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
        }
        
        .detail-card h3 {
            color: #00bcd4;
            margin-top: 0;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            border-bottom: 1px solid rgba(0, 188, 212, 0.3);
            padding-bottom: 0.5rem;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(200, 200, 200, 0.1);
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            font-weight: 600;
            color: #00bcd4;
            min-width: 150px;
        }
        
        .detail-value {
            color: #ffffff;
            text-align: right;
            flex: 1;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: #00bcd4;
        }
        
        .error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 1rem;
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="details-container">
        <div class="details-header">
            <h1>Crew Log Details</h1>
            <button class="back-btn" onclick="window.history.back()">← Back</button>
        </div>

        <div id="crewlogDetails" class="loading">Loading crew log details...</div>
    </div>

    <script src="js/api.js"></script>
    <script>
        async function loadCrewLogDetails() {
            const params = new URLSearchParams(window.location.search);
            const logId = params.get('id');

            if (!logId) {
                document.getElementById('crewlogDetails').innerHTML = '<div class="error">No crew log ID provided</div>';
                return;
            }

            try {
                const response = await fetch(`http://localhost:5000/api/crewlogs/${logId}`, {
                    headers: {
                        'Authorization': `Bearer ${JSON.parse(localStorage.getItem('user')).token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Failed to fetch crew log details');
                const data = await response.json();
                const log = data.data;

                const logDate = log.log_date ? new Date(log.log_date).toLocaleDateString() : 'N/A';
                const createdDate = log.created_at ? new Date(log.created_at).toLocaleString() : 'N/A';
                const updatedDate = log.updated_at ? new Date(log.updated_at).toLocaleString() : 'N/A';

                document.getElementById('crewlogDetails').innerHTML = `
                    <div class="details-grid">
                        <div class="detail-card">
                            <h3>Crew Information</h3>
                            <div class="detail-row">
                                <span class="detail-label">Crew Member:</span>
                                <span class="detail-value">${log.crew_member_name || 'N/A'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Role:</span>
                                <span class="detail-value">${log.crew_member_role || 'N/A'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Log ID:</span>
                                <span class="detail-value">${log.log_id || 'N/A'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Mission ID:</span>
                                <span class="detail-value">${log.mission_id || 'N/A'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Satellite ID:</span>
                                <span class="detail-value">${log.satellite_id || 'N/A'}</span>
                            </div>
                        </div>

                        <div class="detail-card">
                            <h3>Activity Details</h3>
                            <div class="detail-row">
                                <span class="detail-label">Activity Type:</span>
                                <span class="detail-value">${log.activity_type || 'N/A'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Log Date:</span>
                                <span class="detail-value">${logDate}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Log Time:</span>
                                <span class="detail-value">${log.log_time || 'N/A'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Duration (hours):</span>
                                <span class="detail-value">${log.duration_hours || 'N/A'}</span>
                            </div>
                        </div>

                        <div class="detail-card" style="grid-column: 1 / -1;">
                            <h3>Description</h3>
                            <p style="margin: 0; line-height: 1.6; color: #ffffff;">
                                ${log.log_description || 'No description available'}
                            </p>
                        </div>

                        <div class="detail-card" style="grid-column: 1 / -1;">
                            <h3>Metadata</h3>
                            <div class="detail-row">
                                <span class="detail-label">Created:</span>
                                <span class="detail-value">${createdDate}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Last Updated:</span>
                                <span class="detail-value">${updatedDate}</span>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading crew log details:', error);
                document.getElementById('crewlogDetails').innerHTML = `
                    <div class="error">Error loading crew log details: ${error.message}</div>
                `;
            }
        }

        // Load crew log details on page load
        document.addEventListener('DOMContentLoaded', loadCrewLogDetails);
    </script>
</body>
</html>
