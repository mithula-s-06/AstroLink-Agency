<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AstroLink Agency</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="modal active">
        <div class="modal-content">
            <div class="auth-container active">
                <div class="auth-header">
                    <h1>🛰️ AstroLink</h1>
                    <p>Login to access space operations</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    </div>

                    <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem;">
                        <input type="checkbox" id="rememberMe" style="width: 18px; height: 18px; cursor: pointer;">
                        <label for="rememberMe" style="margin: 0; cursor: pointer;">Remember me</label>
                    </div>

                    <button type="submit" class="btn btn-primary full-width">Login</button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="signup.html">Create one</a></p>
                    <p style="margin-top: 0.5rem;"><a href="#" style="font-size: 0.85rem;">Forgot password?</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
