<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AstroLink Agency</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="modal active">
        <div class="modal-content">
            <div class="auth-container active">
                <div class="auth-header">
                    <h1>🛰️ AstroLink</h1>
                    <p>Create your account</p>
                </div>

                <form id="signupForm" class="auth-form">
                    <div class="form-group">
                        <label for="signupName">Full Name</label>
                        <input type="text" id="signupName" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email Address</label>
                        <input type="email" id="signupEmail" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" placeholder="Min 8 chars" required>
                        <small>Include uppercase, lowercase, number, and special character (@$!%*?&)</small>
                    </div>

                    <div class="form-group">
                        <label for="signupConfirmPassword">Confirm Password</label>
                        <input type="password" id="signupConfirmPassword" placeholder="Confirm your password" required>
                    </div>

                    <div class="form-group">
                        <label for="signupRole">Role</label>
                        <select id="signupRole" required>
                            <option value="">Select your role</option>
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem;">
                        <input type="checkbox" id="agreeTerms" required style="width: 18px; height: 18px; cursor: pointer;">
                        <label for="agreeTerms" style="margin: 0; cursor: pointer;">I agree to the Terms & Conditions</label>
                    </div>

                    <button type="submit" class="btn btn-primary full-width">Create Account</button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
