<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetry Report - AstroLink Agency</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        html, body {
            background: #1a2841;
            color: #e0e0e0;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        .details-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(0, 188, 212, 0.3);
            padding-bottom: 1rem;
        }
        
        .details-header h1 {
            font-size: 2.5rem;
            margin: 0;
            color: white;
        }
        
        .back-btn {
            background: #1e3a5f;
            color: #00bcd4;
            border: 1px solid #00bcd4;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: #00bcd4;
            color: #1e3a5f;
        }
        
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .detail-card {
            background: rgba(30, 58, 95, 0.8);
            border: 1px solid rgba(0, 188, 212, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
        }
        
        .detail-card h3 {
            color: #00bcd4;
            margin-top: 0;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            border-bottom: 1px solid rgba(0, 188, 212, 0.3);
            padding-bottom: 0.5rem;
        }
        
        .detail-item {
            margin: 0.8rem 0;
            display: flex;
            justify-content: space-between;
        }
        
        .detail-label {
            font-weight: 600;
            color: #90caf9;
        }
        
        .detail-value {
            color: #e0e0e0;
            text-align: right;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            font-size: 1.1rem;
            color: #00bcd4;
        }
        
        .error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #ef5350;
            padding: 1rem;
            border-radius: 4px;
            margin: 1rem 0;
        }

        .status-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .status-good {
            background: rgba(76, 175, 80, 0.3);
            color: #81c784;
        }

        .status-warning {
            background: rgba(255, 152, 0, 0.3);
            color: #ffb74d;
        }

        .status-critical {
            background: rgba(244, 67, 54, 0.3);
            color: #ef5350;
        }

        .gauge {
            text-align: center;
            padding: 1rem;
            background: rgba(0, 188, 212, 0.1);
            border-radius: 8px;
            margin: 1rem 0;
        }

        .gauge-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00bcd4;
        }

        .gauge-label {
            font-size: 0.9rem;
            color: #90caf9;
            margin-top: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .details-grid {
                grid-template-columns: 1fr;
            }
            
            .details-header {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
            }
            
            .details-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="details-container">
        <div class="details-header">
            <h1>Telemetry Report</h1>
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
        </div>

        <div id="loading" class="loading">Loading telemetry report...</div>
        <div id="errorContainer"></div>
        
        <div id="telemetryDetails" style="display: none;">
            <!-- Main Details Grid -->
            <div class="details-grid">
                <div class="detail-card">
                    <h3>Satellite Information</h3>
                    <div class="detail-item">
                        <span class="detail-label">Satellite ID:</span>
                        <span class="detail-value" id="satelliteId"></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Timestamp:</span>
                        <span class="detail-value" id="timestamp"></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Telemetry ID:</span>
                        <span class="detail-value" id="telemetryId"></span>
                    </div>
                </div>

                <div class="detail-card">
                    <h3>Positional Data</h3>
                    <div class="detail-item">
                        <span class="detail-label">Altitude:</span>
                        <span class="detail-value" id="altitude"></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Velocity:</span>
                        <span class="detail-value" id="velocity"></span>
                    </div>
                </div>
            </div>



            <!-- System Health -->
            <div class="details-grid">
                <div class="detail-card">
                    <h3>System Health</h3>
                    <div class="gauge">
                        <div class="gauge-value" id="batteryValue">0%</div>
                        <div class="gauge-label">Battery Level</div>
                    </div>
                    <div class="gauge">
                        <div class="gauge-value" id="cpuTempValue">0°C</div>
                        <div class="gauge-label">CPU Temperature</div>
                    </div>
                    <div class="gauge">
                        <div class="gauge-value" id="memoryValue">0%</div>
                        <div class="gauge-label">Memory Usage</div>
                    </div>
                </div>

                <div class="detail-card">
                    <h3>Communication</h3>
                    <div class="gauge">
                        <div class="gauge-value" id="signalValue">0 dBm</div>
                        <div class="gauge-label">Signal Strength</div>
                    </div>
                    <div class="gauge">
                         <div class="gauge-value" id="linkQualityValue">0%</div>
                         <div class="gauge-label">Link Quality</div>
                     </div>
                </div>
            </div>

            <!-- Status Summary -->
            <div class="detail-card" style="margin-top: 2rem;">
                <h3>Status Summary</h3>
                <div id="statusSummary"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const user = localStorage.getItem('user');
            if (!user) {
                window.location.href = 'login-new.html';
                return;
            }

            currentUser = JSON.parse(user);
            const params = new URLSearchParams(window.location.search);
            const telemetryId = params.get('id');

            if (!telemetryId) {
                showError('No telemetry ID provided');
                return;
            }

            await loadTelemetryDetails(telemetryId);
        });

        async function loadTelemetryDetails(telemetryId) {
            try {
                const response = await fetch(`${API_BASE}/telemetry/${telemetryId}`, {
                    headers: { 'Authorization': `Bearer ${currentUser.token}` }
                });

                if (!response.ok) throw new Error('Failed to load telemetry');

                const { data } = await response.json();
                displayTelemetryDetails(data);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('telemetryDetails').style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                showError(error.message);
            }
        }

        function displayTelemetryDetails(telemetry) {
            // Helper function to safely format numbers
            const formatNumber = (value, decimals = 2, suffix = '') => {
                if (value === null || value === undefined) return 'N/A';
                const num = parseFloat(value);
                return isNaN(num) ? 'N/A' : `${num.toFixed(decimals)}${suffix}`;
            };

            // Header info
            document.getElementById('telemetryId').textContent = telemetry.telemetry_id;
            document.getElementById('satelliteId').textContent = telemetry.satellite_id;
            document.getElementById('timestamp').textContent = new Date(telemetry.timestamp).toLocaleString();

            // Positional data
            document.getElementById('altitude').textContent = formatNumber(telemetry.altitude, 2, ' km');
            document.getElementById('velocity').textContent = formatNumber(telemetry.velocity, 2, ' m/s');

            // System health
            const batteryValue = parseFloat(telemetry.battery_percentage) || 0;
            document.getElementById('batteryValue').textContent = `${batteryValue.toFixed(2)}%`;
            document.getElementById('batteryValue').parentElement.parentElement.querySelector('.status-badge')?.remove();
            
            const batteryStatus = getBatteryStatus(batteryValue);
            const batteryBadge = document.createElement('div');
            batteryBadge.className = `status-badge status-${batteryStatus}`;
            batteryBadge.textContent = batteryStatus.charAt(0).toUpperCase() + batteryStatus.slice(1);
            document.getElementById('batteryValue').parentElement.appendChild(batteryBadge);

            document.getElementById('cpuTempValue').textContent = formatNumber(telemetry.cpu_temperature_celsius, 2, '°C');
            document.getElementById('memoryValue').textContent = formatNumber(telemetry.memory_usage_percentage, 2, '%');

            // Communication
             document.getElementById('signalValue').textContent = formatNumber(telemetry.signal_strength_dbm, 2, ' dBm');
             document.getElementById('linkQualityValue').textContent = formatNumber(telemetry.link_quality_percentage, 2, '%');

            // Status summary
            const statusHtml = `
                <div class="detail-item">
                    <span class="detail-label">Battery Status:</span>
                    <span class="detail-value">${batteryValue.toFixed(2)}%</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">CPU Temperature:</span>
                    <span class="detail-value">${formatNumber(telemetry.cpu_temperature_celsius, 2, '°C')}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Signal Strength:</span>
                    <span class="detail-value">${formatNumber(telemetry.signal_strength_dbm, 2, ' dBm')}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Link Quality:</span>
                    <span class="detail-value">${formatNumber(telemetry.link_quality_percentage, 2, '%')}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Last Updated:</span>
                    <span class="detail-value">${new Date(telemetry.created_at).toLocaleString()}</span>
                </div>
            `;
            document.getElementById('statusSummary').innerHTML = statusHtml;
        }

        function getBatteryStatus(percentage) {
            if (percentage >= 70) return 'good';
            if (percentage >= 40) return 'warning';
            return 'critical';
        }

        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `<div class="error">${message}</div>`;
            document.getElementById('loading').style.display = 'none';
        }

        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
